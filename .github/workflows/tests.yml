name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xitter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xitter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/xitter_test
      PORT: '3137'
      TEST_ORIGIN: http://localhost:3137
      RATE_LIMITS: 'off'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Unit tests
        run: bun run test:unit
      - name: Migrate test database
        run: bun -e 'import { migrate, sql } from "./src/db"; await migrate(); await sql.close();'
      - name: Database regression tests
        run: |
          bun scripts/test-password-reset-concurrency.ts
          DB_POOL_MAX=1 bun scripts/test-proof-expiry-locks.ts
          bun scripts/test-login-concurrency.ts
          bun scripts/test-password-change-concurrency.ts
          bun scripts/test-two-factor-concurrency.ts
          bun scripts/test-two-factor-credentials.ts
          bun scripts/test-poll-visibility.ts
          bun scripts/test-list-visibility-races.ts
          bun scripts/test-reply-controls-db.ts
          bun scripts/test-search-operators.ts
          bun scripts/test-note-appeals.ts
          bun scripts/test-search-indexing.ts
          bun scripts/test-federated-search.ts
          bun scripts/test-public-api-input.ts
          bun scripts/test-data-export.ts
          bun scripts/test-archive-import.ts
          DB_POOL_MAX=1 bun scripts/test-data-export-chat.ts
          bun scripts/test-scheduled-validation.ts
          bun scripts/test-bookmark-pagination.ts
          bun scripts/test-email-confirmation.ts
          bun scripts/test-email-issuance.ts
          bun scripts/test-password-reset-issuance.ts
          bun scripts/test-admin-password-reset.ts
          bun scripts/test-api-token-security.ts
          bun scripts/test-oauth.ts
          bun scripts/test-money-api.ts
          bun scripts/test-pronouns.ts
          bun scripts/test-api-badges.ts
          bun scripts/test-scheduled-threads.ts
          bun scripts/test-scheduled-quota.ts
          bun scripts/test-scheduled-mentions.ts
          bun scripts/test-scheduled-post-cost.ts
          bun scripts/test-scheduled-single-connection.ts
          bun scripts/test-scheduled-media.ts
          DB_POOL_MAX=1 bun scripts/test-conversation-scheduled.ts
      - name: Media privacy and chunked upload regression tests
        run: |
          bun scripts/test-embed-privacy.ts
          bun scripts/test-poll-media-privacy.ts
          bun scripts/test-media-finalization.ts
          bun scripts/test-media-upload-cap.ts
          bun scripts/test-public-api-chunked-media.ts
      - name: HTTP and encrypted chat regression tests
        run: |
          bun src/server.ts > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent "$TEST_ORIGIN/account/forgot" > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat server.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat server.log
            exit 1
          fi
          bun scripts/test-password-reset.ts
          bun scripts/test-account-settings.ts
          bun scripts/test-two-factor.ts
          bun scripts/test-passkeys.ts
          bun scripts/test-chat.ts
          bun scripts/test-protected-media.ts
          bun -e 'import { createUser } from "./src/auth"; import { createPost } from "./src/posts"; import { sql } from "./src/db"; const id = await createUser("ci_api_a", "CI API A", "testpass123"); await createUser("ci_api_b", "CI API B", "testpass123"); await createPost(id, "CI baseline post"); await sql.close();'
          bun scripts/test-api.ts ci_api_a ci_api_b testpass123 public/logo-light.png
          bun scripts/test-media.ts ci_api_a testpass123 public/logo-light.png
          bun scripts/test-conversation-live.ts public/logo-light.png
          bun scripts/test-polls.ts ci_api_a ci_api_b testpass123
          bun scripts/test-scheduled.ts ci_api_a testpass123
          bun scripts/test-theme-api.ts ci_api_a testpass123
          bun scripts/test-theme-share-api.ts ci_api_a testpass123
          bun scripts/test-money.ts
      - name: Server log on failure
        if: failure()
        run: cat server.log 2>/dev/null || true
