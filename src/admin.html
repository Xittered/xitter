<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · {{instance}}</title>
<link rel="icon" type="image/png" href="/public/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400,0,0">
<style>
	:root { --bg: #000; --panel: #16181c; --line: #2f3336; --text: #e7e9ea; --dim: #71767b; --blue: #1d9bf0; --red: #f4212e; --green: #00ba7c; --gold: #e2b719; }
	* { box-sizing: border-box; }
	body { margin: 0; background: var(--bg); color: var(--text); font: 15px system-ui, -apple-system, "Segoe UI", sans-serif; }
	a { color: var(--blue); text-decoration: none; }
	.icon { font-family: "Material Symbols Outlined"; font-size: 20px; line-height: 1; vertical-align: middle; }
	.app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
	nav { border-right: 1px solid var(--line); padding: 16px 12px; position: sticky; top: 0; height: 100vh; }
	nav .logo { width: 128px; margin: 4px 8px 20px; display: block; }
	nav button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border: 0; border-radius: 999px; background: none; color: var(--text); font: inherit; font-size: 16px; text-align: left; cursor: pointer; }
	nav button:hover { background: var(--panel); }
	nav button.on { font-weight: 700; }
	nav .who { margin-top: 24px; padding: 0 12px; color: var(--dim); font-size: 13px; }
	main { padding: 20px 24px 64px; max-width: 1100px; min-width: 0; }
	h1 { margin: 0 0 16px; font-size: 22px; }
	h2 { margin: 24px 0 10px; font-size: 17px; }
	.bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; align-items: center; }
	input, select, textarea { padding: 9px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: inherit; font: inherit; }
	input:focus, select:focus, textarea:focus { outline: 2px solid var(--blue); border-color: transparent; }
	textarea { width: 100%; min-height: 70px; resize: vertical; }
	.btn { padding: 8px 16px; border: 1px solid var(--line); border-radius: 999px; background: none; color: var(--text); font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; }
	.btn:hover { background: var(--panel); }
	.btn.primary { background: var(--text); color: #0f1419; border-color: var(--text); }
	.btn.danger { color: var(--red); border-color: rgba(244,33,46,.5); }
	.btn:disabled { opacity: .5; cursor: default; }
	.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
	.card { background: var(--panel); border-radius: 12px; padding: 14px 16px; }
	.card b { display: block; font-size: 24px; margin-top: 4px; }
	.card span { color: var(--dim); font-size: 13px; }
	.table { width: 100%; border-collapse: collapse; }
	.table th { text-align: left; color: var(--dim); font-weight: 400; font-size: 13px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
	.table td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
	.table tr.click { cursor: pointer; }
	.table tr.click:hover td { background: var(--panel); }
	.scroll { overflow-x: auto; }
	.person { display: flex; align-items: center; gap: 10px; min-width: 0; }
	.person img.avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: var(--panel); flex: none; }
	.person .names { min-width: 0; }
	.person .names div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.dim { color: var(--dim); }
	.small { font-size: 13px; }
	.flag { width: 16px; height: 16px; border-radius: 3px; vertical-align: -2px; }
	.badge { display: inline-block; width: 14px; height: 14px; border-radius: 50%; vertical-align: -1px; }
	.badge.blue { background: var(--blue); } .badge.business { background: var(--gold); border-radius: 3px; } .badge.government { background: #829aab; border-radius: 3px; } .badge.government_individual { background: #829aab; }
	.pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); }
	.pill.suspended { color: var(--red); border-color: rgba(244,33,46,.5); }
	.pill.restricted, .pill.limited { color: var(--gold); border-color: rgba(226,183,25,.5); }
	.pill.staff { color: var(--blue); border-color: rgba(29,155,240,.5); }
	.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
	.box { background: var(--panel); border-radius: 12px; padding: 16px; }
	.box h2 { margin-top: 0; }
	.field { display: grid; gap: 4px; margin-bottom: 10px; }
	.field label { color: var(--dim); font-size: 13px; }
	.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
	label.row { flex-wrap: nowrap; align-items: flex-start; }
	label.row input { margin-top: 3px; flex: none; }
	.flags { display: flex; flex-wrap: wrap; gap: 6px; }
	.flags button { width: 34px; height: 34px; padding: 0; border: 2px solid var(--line); border-radius: 6px; background: none; color: var(--dim); font-size: 11px; cursor: pointer; display: grid; place-items: center; }
	.flags button img { width: 20px; height: 20px; border-radius: 3px; }
	.flags button.on { border-color: var(--blue); }
	.chart { display: flex; align-items: flex-end; gap: 4px; height: 90px; margin-top: 8px; }
	.chart div { flex: 1; background: var(--blue); border-radius: 3px 3px 0 0; min-height: 2px; position: relative; }
	nav .count { margin-left: auto; background: var(--blue); color: #fff; border-radius: 999px; padding: 1px 7px; font-size: 12px; font-weight: 700; }
	.code { font-family: ui-monospace, Consolas, monospace; }
	.notice { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--blue); color: #fff; padding: 10px 18px; border-radius: 6px; z-index: 9; max-width: calc(100vw - 32px); }
	.notice.err { background: var(--red); }
	.ask { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
	.ask .box { max-width: 420px; width: 100%; }
	.ask p { margin: 0 0 14px; }
	.secret { background: var(--bg); border: 1px dashed var(--line); padding: 10px; border-radius: 6px; margin-top: 8px; word-break: break-all; }
	.empty { color: var(--dim); padding: 24px 0; }
	.mediagrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
	.mediagrid .box { padding: 10px; }
	.thumb { position: relative; display: grid; place-items: center; aspect-ratio: 1; background: var(--bg); border-radius: 8px; overflow: hidden; }
	.thumb img { width: 100%; height: 100%; object-fit: cover; }
	.thumb .play { position: absolute; font-size: 40px; color: #fff; text-shadow: 0 0 8px #000; }
	.list p { margin: 0 0 10px; }
	.list p:last-child { margin-bottom: 0; }
	@media (max-width: 760px) {
		.app { grid-template-columns: 1fr; }
		nav { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 2px; }
		nav .logo { display: none; }
		nav button { width: auto; padding: 8px 10px; font-size: 14px; }
		nav .who { display: none; }
		main { padding: 16px; }
	}
</style>
</head>
<body>
<div class="app">
	<nav id="nav">
		<img class="logo" src="/public/logo-dark.png" alt="{{instance}}">
	</nav>
	<main id="main"></main>
</div>
<script>
"use strict";
const csrf = (document.cookie.match(/(?:^|; )ct0=([^;]+)/) || [])[1] || "";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const $ = (sel, root = document) => root.querySelector(sel);
const RANK = { support: 1, moderator: 2, admin: 3 };
let me = null;
let flags = [];
const can = (role) => me && RANK[me.role] >= RANK[role];

async function api(action, body = {}) {
	const r = await fetch("/admin/api/" + action, { method: "POST", headers: { "content-type": "application/json", "x-csrf-token": csrf }, body: JSON.stringify(body) });
	const data = await r.json().catch(() => ({}));
	if (!r.ok) throw new Error(data.error || "Request failed (" + r.status + ")");
	return data;
}

let noticeTimer;
// An in-page confirmation: embedded browsers (the desktop app's own, some
// webviews) answer window.confirm with false without showing anything.
function ask(text) {
	return new Promise((done) => {
		const back = document.createElement("div");
		back.className = "ask";
		back.innerHTML = '<div class="box"><p></p><div class="row" style="justify-content:flex-end"><button class="btn" data-no>Cancel</button><button class="btn primary" data-yes>OK</button></div></div>';
		back.querySelector("p").textContent = text;
		const close = (answer) => { back.remove(); document.removeEventListener("keydown", key); done(answer); };
		const key = (e) => { if (e.key === "Escape") close(false); if (e.key === "Enter") close(true); };
		back.querySelector("[data-no]").onclick = () => close(false);
		back.querySelector("[data-yes]").onclick = () => close(true);
		back.onclick = (e) => { if (e.target === back) close(false); };
		document.addEventListener("keydown", key);
		document.body.appendChild(back);
		back.querySelector("[data-yes]").focus();
	});
}

function notice(text, err = false) {
	let n = $(".notice");
	if (!n) { n = document.createElement("div"); document.body.appendChild(n); }
	n.className = "notice" + (err ? " err" : "");
	n.textContent = text;
	clearTimeout(noticeTimer);
	noticeTimer = setTimeout(() => n.remove(), 3500);
}

// runs an action from a button, with its errors shown
async function act(fn, done) {
	try { const r = await fn(); if (done) notice(done); return r; } catch (e) { notice(e.message, true); }
}

// X's labels under a post (model.ts NOTICE_TYPES)
const NOTICE_LABELS = { Fosnr: "Visibility limited", Misleading: "Misleading", StayInformed: "Stay informed", GetTheLatest: "Get the latest", GovernmentRequested: "Legally required notice" };
const when = (d) => d ? new Date(d).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }) : "never";
const duration = (s) => s < 3600 ? Math.floor(s / 60) + " min" : s < 172800 ? Math.floor(s / 3600) + " h" : Math.floor(s / 86400) + " days";
// "Edge on Windows" from a user agent
function browser(ua) {
	if (!ua) return "Unknown browser";
	const name = /Edg\//.test(ua) ? "Edge" : /OPR\//.test(ua) ? "Opera" : /Firefox\//.test(ua) ? "Firefox" : /Chrome\//.test(ua) ? "Chrome" : /Safari\//.test(ua) ? "Safari" : /okhttp|Dalvik/.test(ua) ? "Android app" : "Browser";
	const os = /Windows/.test(ua) ? "Windows" : /Android/.test(ua) ? "Android" : /iPhone|iPad/.test(ua) ? "iOS" : /Mac OS/.test(ua) ? "macOS" : /Linux/.test(ua) ? "Linux" : "";
	return os ? name + " on " + os : name;
}
const avatar = (u) => u.avatar_url ? (u.avatar_url.startsWith("/") ? u.avatar_url : u.avatar_url) : "/abs/sticky/default_profile_images/default_profile_normal.png";
const badge = (u) => u.verified_type ? '<span class="badge ' + esc(u.verified_type) + '" title="' + esc(u.verified_type) + '"></span>' : "";
const flagImg = (u) => u.flag ? '<img class="flag" alt="' + esc(u.flag) + '" src="/public/flag-' + esc(u.flag) + '.svg">' : "";
const standing = (u) => (u.status && u.status !== "active" ? ' <span class="pill ' + esc(u.status) + '">' + esc(u.status) + "</span>" : "") + (u.role ? ' <span class="pill staff">' + esc(u.role) + "</span>" : "");
const person = (u) => '<div class="person"><img class="avatar" alt="" src="' + esc(avatar(u)) + '"><div class="names"><div><b>' + esc(u.name) + "</b> " + badge(u) + " " + flagImg(u) + '</div><div class="dim small">@' + esc(u.screen_name) + standing(u) + "</div></div></div>";

const PAGES = {
	overview: { icon: "monitoring", title: "Overview" },
	reports: { icon: "flag", title: "Reports" },
	appeals: { icon: "gavel", title: "Appeals" },
	users: { icon: "group", title: "Users" },
	orgs: { icon: "domain", title: "Organisations" },
	posts: { icon: "chat", title: "Posts" },
	automod: { icon: "shield", title: "Automod" },
	articles: { icon: "article", title: "Articles" },
	media: { icon: "photo_library", title: "Media" },
	invites: { icon: "confirmation_number", title: "Invites" },
	badges: { icon: "verified", title: "Badges" },
	stickers: { icon: "add_reaction", title: "Stickers" },
	hashflags: { icon: "favorite", title: "Branded hashtags" },
	switches: { icon: "toggle_on", title: "Feature switches", role: "admin" },
	topics: { icon: "tag", title: "Topics" },
	cards: { icon: "newspaper", title: "Explore cards" },
	email: { icon: "mail", title: "Email" },
	apps: { icon: "devices", title: "Client apps" },
	settings: { icon: "tune", title: "Settings" },
	errors: { icon: "bug_report", title: "Errors" },
	security: { icon: "shield_lock", title: "Security", role: "admin" },
	backups: { icon: "backup", title: "Backups", role: "admin" },
	client: { icon: "system_update", title: "Client", role: "admin" },
	audit: { icon: "history", title: "Audit log" },
};

function go(hash) { location.hash = hash; }
window.addEventListener("hashchange", route);

async function route() {
	const [page, arg] = location.hash.slice(1).split("/");
	const name = PAGES[page] ? page : page === "user" ? "users" : "overview";
	document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.page === name));
	const main = $("#main");
	main.innerHTML = '<div class="empty">Loading…</div>';
	try {
		if (page === "user" && arg) await renderUser(main, arg);
		else await RENDER[name](main);
	} catch (e) {
		main.innerHTML = '<div class="empty">' + esc(e.message) + "</div>";
	}
}

const RENDER = {
	async overview(main) {
		const [s, h] = await Promise.all([api("stats"), api("health")]);
		const mb = (bytes) => (Number(bytes) / 1048576).toFixed(1) + " MB";
		const cards = (list) => '<div class="cards">' + list.map(([k, v]) => '<div class="card"><span>' + esc(k) + "</span><b>" + esc(v) + "</b></div>").join("") + "</div>";
		const chart = (key, what) => {
			const max = Math.max(1, ...s.days.map((d) => d[key]));
			return '<div class="box"><h2>' + esc(what[0].toUpperCase() + what.slice(1)) + ' per day, last two weeks</h2><div class="chart">' +
				s.days.map((d) => '<div title="' + esc(d.day) + ": " + d[key] + " " + esc(what) + '" style="height:' + (d[key] / max) * 100 + '%"></div>').join("") +
				'</div><div class="row dim small" style="justify-content:space-between;margin-top:6px"><span>' + esc(s.days[0]?.day) + "</span><span>" + esc(s.days[s.days.length - 1]?.day) + "</span></div></div>";
		};
		const list = (title, rows, empty) => '<div class="box"><h2>' + title + "</h2>" + (rows.length ? '<div class="list">' + rows.join("") + "</div>" : '<p class="dim small">' + empty + "</p>") + "</div>";
		main.innerHTML = "<h1>Overview</h1>" +
			cards([["Open reports", s.open_reports], ["Open errors", s.open_errors], ["Accounts", s.users], ["Sanctioned", s.sanctioned], ["Open invites", s.open_invites], ["Videos converting", s.videos_processing]]) +
			"<h2>People</h2>" + cards([["Active today", s.active_day], ["Active this week", s.active_week], ["Active this month", s.active_month], ["Follows", s.follows]]) +
			"<h2>Content</h2>" + cards([["Posts", s.posts], ["Posts today", s.posts_today], ["Likes", s.likes], ["Reposts", s.reposts], ["Bookmarks", s.bookmarks], ["Media files", s.media], ["Media stored", mb(s.media_bytes)]]) +
			'<div class="grid2">' + chart("posts", "posts") + chart("signups", "sign-ups") + chart("likes", "likes") + chart("follows", "follows") + chart("reports", "reports") + "</div>" +
			'<div class="grid2" style="margin-top:16px">' +
			list("Most new followers this week", s.risers.map((u) => '<p class="row" style="justify-content:space-between"><a href="#user/' + esc(u.id) + '">' + person(u) + '</a><b>+' + u.gained + "</b></p>"), "No new follows this week.") +
			list("Most liked this week", s.liked.map((p) => '<p><a target="_blank" href="/' + esc(p.screen_name) + "/status/" + esc(p.id) + '">@' + esc(p.screen_name) + "</a> " + esc(p.text.slice(0, 120)) + ' <span class="dim small">· ' + p.likes + " likes</span></p>"), "No likes this week.") +
			list("Storage by kind", s.storage.map((m) => "<p>" + esc(m.kind) + ' <span class="dim small">· ' + m.files + " files · " + mb(m.bytes) + "</span></p>"), "Nothing uploaded.") +
			list("Accounts by sign-up app", s.sources.map((r) => "<p>" + esc(r.source) + ' <span class="dim small">· ' + r.users + "</span></p>"), "No accounts.") +
			"</div>" +
			"<h2>Server</h2>" + '<div class="cards">' +
			[["Up for", duration(h.uptime)], ["Memory", (h.memory / 1048576).toFixed(0) + " MB"], ["Database", (Number(h.database.bytes) / 1048576).toFixed(1) + " MB"],
				["Database answers in", h.database.latency_ms + " ms"], ["Bun", h.runtime], ["Client build", h.client_build ? h.client_build.slice(0, 7) : "none"]]
				.map(([k, v]) => '<div class="card"><span>' + esc(k) + "</span><b>" + esc(v) + "</b></div>").join("") + "</div>";
	},

	async client(main) {
		const c = await api("client");
		const short = (sha) => sha ? sha.slice(0, 10) : "none";
		main.innerHTML = "<h1>Client</h1>" +
			'<p class="dim">The X web client this instance serves is a pinned build. Updating pins the build x.com serves now (what <span class="code">bun scripts/fetch-client.ts --latest</span> does) and keeps the current one to go back to. A new build can bring requests this server doesn\'t answer yet; check the app after updating. A pin taken with --token loses its signed-in feature switches here: run it by hand to keep them.</p>' +
			'<div class="cards"><div class="card"><span>Serving</span><b class="code">' + esc(short(c.sha)) + '</b><span class="small dim">pinned ' + esc(when(c.fetchedAt)) + "</span></div>" +
			'<div class="card"><span>Previous</span><b class="code">' + esc(short(c.previous?.sha)) + "</b>" + (c.previous ? '<span class="small dim">pinned ' + esc(when(c.previous.fetchedAt)) + "</span>" : "") + "</div>" +
			'<div class="card"><span>On x.com</span><b class="code" id="latest">?</b></div></div>' +
			'<div class="row" style="margin-top:16px"><button class="btn" id="ccheck">Check x.com</button><button class="btn primary" id="cupdate">Update</button>' + (c.previous ? '<button class="btn" id="cback">Go back to the previous build</button>' : "") + "</div>";
		$("#ccheck").onclick = () => act(async () => { const r = await api("checkClient"); $("#latest").textContent = short(r.latest) + (r.latest === r.sha ? " (same)" : ""); });
		$("#cupdate").onclick = async () => {
			if (!(await ask("Pin the build x.com serves now? Everyone gets it on their next page load."))) return;
			$("#cupdate").disabled = true; $("#cupdate").textContent = "Updating…";
			act(async () => { const r = await api("updateClient"); notice(r.changed ? "Now serving " + short(r.sha) : "Already the latest build"); }).then(route);
		};
		if ($("#cback")) $("#cback").onclick = async () => {
			if (!(await ask("Serve the previous build again?"))) return;
			act(() => api("rollbackClient"), "Back on the previous build").then(route);
		};
	},

	async backups(main) {
		const { backups, schedule, dir } = await api("backups");
		const size = (n) => n < 1048576 ? Math.ceil(n / 1024) + " KB" : (n / 1048576).toFixed(1) + " MB";
		main.innerHTML = "<h1>Backups</h1>" +
			'<p class="dim">Dumps of the database (pg_dump\'s custom format) in <span class="code">' + esc(dir) + '</span> on the server. Uploaded media and branding are files in media/ and data/: copy those directories too. To restore, stop the server and run <span class="code">pg_restore --clean --if-exists -d "$DATABASE_URL" &lt;file&gt;</span>.</p>' +
			'<div class="box" style="margin-bottom:16px"><h2>Schedule</h2><div class="row"><label class="row"><input type="checkbox" id="bdaily"' + (schedule.daily ? " checked" : "") + "> A backup every day</label>" +
			'<label class="row small">keep the newest <input id="bkeep" type="number" min="1" max="90" style="width:70px" value="' + schedule.keep + '"></label><button class="btn" id="bsave">Save</button></div></div>' +
			'<div class="row" style="margin-bottom:16px"><button class="btn primary" id="bnow">Back up now</button></div>' +
			'<div class="scroll">' + (backups.length ? '<table class="table"><tr><th>File</th><th>Size</th><th>Made</th><th></th></tr>' +
				backups.map((b) => '<tr><td class="code">' + esc(b.name) + "</td><td>" + size(b.bytes) + '</td><td class="small dim">' + esc(when(b.created_at)) + '</td><td class="row"><a class="btn" href="/admin/backups/' + esc(b.name) + '" download>Download</a><button class="btn danger" data-del="' + esc(b.name) + '">Delete</button></td></tr>').join("") + "</table>"
				: '<div class="empty">No backups yet.</div>') + "</div>";
		$("#bsave").onclick = () => act(() => api("saveBackupSchedule", { daily: $("#bdaily").checked, keep: Number($("#bkeep").value) }), "Saved").then(route);
		$("#bnow").onclick = () => { $("#bnow").disabled = true; $("#bnow").textContent = "Backing up…"; act(() => api("createBackup"), "Backup made").then(route); };
		main.querySelectorAll("[data-del]").forEach((b) => b.onclick = async () => {
			if (!(await ask("Delete " + b.dataset.del + "?"))) return;
			act(() => api("deleteBackup", { name: b.dataset.del }), "Deleted").then(route);
		});
	},

	async security(main) {
		const s = await api("security");
		const mine = (x) => x.user_id === me.id;
		const canEnd = (x) => !x.current && (mine(x) || RANK[x.role] < RANK[me.role]);
		main.innerHTML = "<h1>Security</h1>" + '<div class="grid2">' +
			'<div class="box"><h2>Two-factor for staff</h2><label class="row"><input type="checkbox" id="s2fa"' + (s.security.staff_2fa ? " checked" : "") + "> Staff need two-factor authentication to open this panel</label>" +

					: '<div class="empty" style="width:100%">No stickers in this pack yet.</div>') + "</div>" +

	async switches(main) {
		const { switches } = await api("featureSwitches");
		const effective = (s) => "override" in s ? s.override : "xitter" in s ? s.xitter : s.build;
		const from = (s) => "override" in s ? "admin" : "xitter" in s ? "Xitter" : "build";
		const show = (v) => v === undefined ? "unset" : typeof v === "string" ? v : JSON.stringify(v);
		main.innerHTML = "<h1>Feature switches</h1>" +
			'<p class="dim">The X client turns its features on and off with these switches. A value set here wins over the pinned build\'s and Xitter\'s own, for everyone, from their next page load. Many switches need server support Xitter doesn\'t have: turn on something new, then check the app. The instance\'s own features are under Settings.</p>' +
			'<div class="row" style="margin-bottom:12px"><input id="sq" placeholder="Search ' + switches.length + ' switches, e.g. grok, poll, edit_tweet" style="flex:1;min-width:200px">' +
			'<select id="sf"><option value="">All</option><option value="admin">Set here</option><option value="Xitter">Set by Xitter</option><option value="on">On</option></select></div>' +
			'<div id="slist"></div>';
		const list = $("#slist");
		const draw = () => {
			const q = $("#sq").value.trim().toLowerCase(), f = $("#sf").value;
			const hits = switches.filter((s) => (!q || s.name.includes(q)) && (!f || (f === "on" ? effective(s) === true : from(s) === f)));
			list.innerHTML = (hits.length > 200 ? '<p class="dim small">Showing 200 of ' + hits.length + '; narrow the search.</p>' : "") +
				'<div class="scroll"><table class="table"><tr><th>Switch</th><th>Value</th><th>From</th><th></th></tr>' +
				hits.slice(0, 200).map((s) => {
					const v = effective(s), bool = typeof v === "boolean" || (v === undefined && typeof s.build !== "object");
					const edit = bool
						? '<button class="btn' + (v === true ? " primary" : "") + '" data-set="true">On</button> <button class="btn' + (v === false ? " primary" : "") + '" data-set="false">Off</button>'
						: '<input data-val value="' + esc(typeof v === "string" ? v : JSON.stringify(v ?? "")) + '" style="width:160px"> <button class="btn" data-save>Set</button>';
					return '<tr data-name="' + esc(s.name) + '"><td class="code small" style="word-break:break-all">' + esc(s.name) + '</td><td class="small" style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + esc(show(v)) + '">' + esc(show(v)) +
						("override" in s ? '<div class="dim small">build: ' + esc(show(s.build)) + "</div>" : "") + '</td><td class="small">' + from(s) + '</td><td style="white-space:nowrap">' + edit +
						("override" in s ? ' <button class="btn danger" data-reset>Reset</button>' : "") + "</td></tr>";
				}).join("") + "</table></div>";
			list.querySelectorAll("tr[data-name]").forEach((tr) => {
				const name = tr.dataset.name;
				const set = (value) => act(() => api("setFeatureSwitch", { name, value }), name + " set").then(route);
				tr.querySelectorAll("[data-set]").forEach((b) => b.onclick = () => set(b.dataset.set === "true"));
				const save = tr.querySelector("[data-save]");
				if (save) save.onclick = () => {
					const raw = tr.querySelector("[data-val]").value.trim();
					let value = raw;
					// a number or a JSON list as itself, anything else as text
					if (/^-?\d+(\.\d+)?$/.test(raw)) value = Number(raw);
					else if (/^\[.*\]$/.test(raw)) { try { value = JSON.parse(raw); } catch {} }
					set(value);
				};
				const reset = tr.querySelector("[data-reset]");
				if (reset) reset.onclick = () => act(() => api("setFeatureSwitch", { name, reset: true }), name + " reset").then(route);
			});
		};
		$("#sq").oninput = draw;
		$("#sf").onchange = draw;
		draw();
	},

	async automod(main) {
		main.innerHTML = '<h1>Automod</h1><p class="dim">New posts and profiles are checked as they\'re written. This looks through what was there before: visible posts, newest first, and every profile. Nothing happens to what it finds until you act. Settings &gt; Automod holds the strike ladder.</p>' +
			'<div class="bar"><button class="btn primary" id="scan">Scan</button><span class="dim small" id="scanState"></span></div><div id="hits"></div>' +
			'<h2>Held after deletion</h2><p class="dim small">When a suspended account is deleted, its handles, email and recent addresses stay here, so nobody can take the handle or a look-alike of it, and sign-ups from that email or those addresses are refused. Handles of suspended accounts that still exist are held without being listed.</p><div id="held"></div>';
		const drawHeld = async () => {
			const { held } = await api("heldIdentities");
			$("#held").innerHTML = held.length
				? '<div class="scroll"><table class="table"><tr><th>Kind</th><th>Value</th><th>Why</th><th></th></tr>' + held.map((h, i) => "<tr><td>" + esc(h.kind) + '</td><td class="code">' + esc(h.value) + '</td><td class="small dim">' + esc(h.reason) + " · " + esc(when(h.created_at)) + "</td><td>" +
					(can("admin") ? '<button class="btn" data-release="' + i + '">Release</button>' : "") + "</td></tr>").join("") + "</table></div>"
				: '<div class="empty">Nothing held.</div>';
			$("#held").querySelectorAll("[data-release]").forEach((b) => b.onclick = () => {
				const h = held[Number(b.dataset.release)];
				act(() => api("releaseIdentity", { kind: h.kind, value: h.value }), "Released").then(drawHeld);
			});
		};
		drawHeld();
		const found = [];
		let next = null, scanned = 0;
		const draw = () => {
			$("#hits").innerHTML = found.length
				? '<div class="scroll"><table class="table"><tr><th>What</th><th>Who</th><th>Matched</th><th></th></tr>' + found.map((h, i) =>
					'<tr><td style="max-width:420px;white-space:pre-wrap">' + esc(h.text) + '<div class="dim small">' + (h.kind === "post" ? '<a href="/' + esc(h.screen_name) + "/status/" + esc(h.id) + '" target="_blank">open post</a>' : "profile") + "</div></td>" +
					'<td><a href="#user/' + esc(h.user_id) + '">@' + esc(h.screen_name) + "</a>" + (h.status !== "active" ? ' <span class="pill ' + esc(h.status) + '">' + esc(h.status) + "</span>" : "") + "</td>" +
					'<td><span class="pill">' + esc(h.category) + '</span> <span class="small dim code">' + esc(h.term) + "</span></td><td>" +
					(h.kind === "post" && !h.done ? '<button class="btn" data-hide="' + i + '">Hide</button>' : h.done ? '<span class="dim small">hidden</span>' : "") + "</td></tr>").join("") + "</table></div>"
				: scanned ? '<div class="empty">Nothing found so far.</div>' : "";
			$("#hits").querySelectorAll("[data-hide]").forEach((b) => b.onclick = () => {
				const h = found[Number(b.dataset.hide)];
				act(() => api("setPostVisibility", { id: h.id, hidden: true, sensitive: !!h.sensitive }), "Post hidden").then(() => { h.done = true; draw(); });
			});
		};
		$("#scan").onclick = () => act(async () => {
			if (!next) {
				found.length = 0;
				scanned = 0;
			}
			const r = await api("automodScan", next ? { before: next } : {});
			found.push(...r.hits);
			scanned += r.scanned;
			next = r.next;
			$("#scanState").textContent = scanned + (scanned === 1 ? " post" : " posts") + " scanned, " + found.length + " found" + (next ? "" : ", that's everything");
			$("#scan").textContent = next ? "Scan older posts" : "Scan again";
			draw();
		});
	},

// the number of open reports beside Reports in the menu
async function refreshCounts() {
	const s = await api("stats").catch(() => null);
	if (!s) return;
	for (const [page, n] of [["reports", s.open_reports], ["errors", s.open_errors]]) {
		const b = $('nav [data-page="' + page + '"]');
		if (!b) continue;
		b.querySelector(".count")?.remove();
		if (n) b.insertAdjacentHTML("beforeend", '<span class="count">' + n + "</span>");
	}
}

function userTable(users, orgs = false, pick = false) {

			'</td><td class="small dim">' + esc(when(u.created_at)) + '</td><td class="small dim">' + esc(when(u.last_seen_at)) + "</td></tr>").join("") + "</table>";

		[["active", "Reinstate", ""], ["restricted", "Restrict", "Can read, can't post"], ["limited", "Limit", "Only followers see their posts"], ["suspended", "Suspend", "Signed out, hidden everywhere"]]
			.map(([s, l, t]) => '<button class="btn' + (s === "suspended" ? " danger" : "") + '" data-status="' + s + '" title="' + esc(t) + '"' + (u.status === s || !can("moderator") || self ? " disabled" : "") + ">" + l + "</button>").join("") +
		'</div><p class="dim small">Restrict: can read, can\'t post. Limit: only followers see their posts. Suspend: signed out and hidden everywhere.</p></div>' +
		// access
		'<div class="box"><h2>Access</h2><div class="row"><button class="btn" id="reset">Reset password</button><button class="btn" id="signout">Sign out everywhere</button></div><div id="secret"></div>' +
		'<label class="row" style="margin-top:14px"><input type="checkbox" id="notes-access"' + (u.notes_writer ? " checked" : "") + (can("admin") ? "" : " disabled") + '>Community Notes writing access</label>' +
		(can("admin") ? '<div class="field" style="margin-top:14px"><label>Staff role</label><select id="role"><option value="">none</option>' + ["support", "moderator", "admin"].map((r) => '<option' + (u.role === r ? " selected" : "") + ">" + r + "</option>").join("") + "</select></div>" : "") +
		(can("admin") && !self ? '<div class="field" style="margin-top:14px"><label>Delete account (type @' + esc(u.screen_name) + ' to confirm)</label><div class="row"><input id="confirm" placeholder="' + esc(u.screen_name) + '"><button class="btn danger" id="delete">Delete forever</button></div></div>' : "") +
		"</div>" +
		// messages, private notes, sessions
		'<div class="box"><h2>Messages to the account</h2><p class="dim small">They arrive in its notifications. A warning or strike can be appealed.</p>' +
		(messages.length ? '<div class="list" style="margin-bottom:12px">' + messages.map((m) => '<p><span class="pill' + (m.kind === "strike" ? " suspended" : m.kind === "warning" ? " restricted" : "") + '">' + esc(m.kind) + "</span> " +
			(m.revoked_at ? '<s class="dim">' + esc(m.body) + "</s>" : esc(m.body)) + '<br><span class="dim small">' + (m.actor ? "@" + esc(m.actor) + " · " : "") + esc(when(m.created_at)) + (m.read_at ? " · read" : "") + (m.revoked_at ? " · withdrawn" : "") + "</span>" +
			(m.kind === "strike" && !m.revoked_at && can("moderator") ? ' <button class="btn" data-unstrike="' + esc(m.id) + '">Withdraw</button>' : "") + "</p>").join("") + "</div>" : "") +
		(can("moderator") && !self ? '<div class="field"><select id="msgKind"><option value="message">Message</option><option value="warning">Warning</option><option value="strike">Strike</option></select></div>' +
			'<div class="field"><textarea id="msgBody" maxlength="2000" placeholder="What they\'ll read"></textarea></div><label class="row" style="margin:6px 0"><input type="checkbox" id="msgEscalate" checked> A strike counts toward suspension</label><button class="btn primary" id="send">Send</button>' : "") + "</div>" +
		'<div class="box"><h2>Staff notes</h2><p class="dim small">Only staff see these.</p>' +
		(notes.length ? '<div class="list" style="margin-bottom:12px">' + notes.map((n) => '<p style="white-space:pre-wrap">' + esc(n.body) + '<br><span class="dim small">@' + esc(n.actor ?? "?") + " · " + esc(when(n.created_at)) + "</span></p>").join("") + "</div>" : "") +
		'<div class="field"><textarea id="noteBody" maxlength="2000" placeholder="Context for other staff"></textarea></div><button class="btn primary" id="addNote">Add note</button></div>' +
		(handles.length ? '<div class="box"><h2>Handle history</h2><div class="list">' + handles.map((h) => "<p>@" + esc(h.old_name) + " → @" + esc(h.new_name) + ' <span class="dim small">' + esc(when(h.changed_at)) + "</span></p>").join("") + "</div></div>" : "") +
		'<div class="box"><h2>Sessions</h2>' + (sessions === null ? '<p class="dim small">Hidden: this account is staff at your level or above.</p>'
			: sessions.length ? '<div class="list">' + sessions.slice(0, 10).map((s) => "<p>" + esc(browser(s.user_agent)) + (s.current ? ' <span class="pill staff">you, now</span>' : "") +
				'<br><span class="dim small">' + (s.ip ? esc(s.ip) + " · " : "") + "signed in " + esc(when(s.created_at)) + " · last active " + esc(when(s.last_seen_at)) + "</span>" +
				(s.current ? "" : ' <button class="btn" data-session="' + esc(s.id) + '">Sign out</button>') + "</p>").join("") +
				(sessions.length > 10 ? '<p class="dim small">and ' + (sessions.length - 10) + ' older (Access → Sign out everywhere ends them all)</p>' : "") + "</div>"
			: '<p class="dim small">Not signed in anywhere.</p>') + "</div>" +
		"</div>" +
		// organisation
		(isOrg ? '<h2>Affiliates</h2>' + (can("admin") ? '<div class="bar"><input id="aff" placeholder="@handle to add"><button class="btn primary" id="addaff">Add affiliate</button></div>' : "") +
			(affiliates.length ? '<div class="scroll"><table class="table">' + affiliates.map((a) => '<tr><td>' + person(a) + "</td><td>" + (can("admin") ? '<button class="btn danger" data-unaff="' + esc(a.id) + '">Remove</button>' : "") + "</td></tr>").join("") + "</table></div>" : '<div class="empty">No affiliates yet.</div>') : "") +
		(alts.length ? '<h2>Seen from the same addresses</h2><p class="dim small">Accounts that signed in from an address this one used in the last 90 days. Shared networks put strangers here too.</p><p>' + alts.map((a) => '<a href="#user/' + esc(a.id) + '">@' + esc(a.screen_name) + "</a>" + (a.status !== "active" ? ' <span class="pill ' + esc(a.status) + '">' + esc(a.status) + "</span>" : "")).join(", ") + "</p>" : "") +
		(invited.length ? "<h2>Invited</h2><p>" + invited.map((i) => '<a href="#user/' + esc(i.id) + '">@' + esc(i.screen_name) + "</a>").join(", ") + "</p>" : "") +
		"<h2>History</h2>" + (log.length ? '<table class="table">' + log.map((e) => '<tr><td class="small dim">' + esc(when(e.created_at)) + "</td><td>" + (e.automatic ? "automod" : "@" + esc(e.actor ?? "?")) + " " + esc(e.action.replace(/_/g, " ")) + '</td><td class="small dim code">' + esc(e.detail ? JSON.stringify(e.detail) : "") + "</td></tr>").join("") + "</table>" : '<div class="empty">No staff actions yet.</div>');

	const again = () => renderUser(main, id);
	if ($("#saveCounts")) $("#saveCounts").onclick = () => act(() => api("setUserCounts", { id, counts: Object.fromEntries([...main.querySelectorAll("[data-count]")].map((el) => [el.dataset.count, el.value])) }), "Counts saved").then(again);
	if ($("#save")) $("#save").onclick = () => {
		const body = { id };
		main.querySelectorAll("[data-f]").forEach((el) => body[el.dataset.f] = el.value);
		act(() => api("updateUser", body), "Profile saved").then(again);
	};
	if ($("#badge")) $("#badge").onchange = () => act(() => api("setBadge", { id, badge: $("#badge").value }), "Badge set").then(again);
	if ($("#plabel")) $("#plabel").onchange = () => act(() => api("setProfileLabel", { id, label: $("#plabel").value }), "Label set").then(again);
	if ($("#translator")) $("#translator").onchange = () => act(() => api("setTranslator", { id, translator: $("#translator").value }), "Translator badge set").then(again);
	main.querySelectorAll("[data-flag]").forEach((b) => b.onclick = () => act(() => api("setFlag", { id, flag: b.dataset.flag }), "Flag set").then(again));
	main.querySelectorAll("[data-status]").forEach((b) => b.onclick = async () => {
		if (b.dataset.status === "suspended" && !(await ask("Suspend @" + u.screen_name + "?"))) return;
		const hours = $("#for").value;
		act(() => hours && b.dataset.status !== "active"
			? api("setTemporaryStatus", { id, status: b.dataset.status, hours, reason: $("#reason").value })
			: api("setStatus", { id, status: b.dataset.status, reason: $("#reason").value }), "Standing changed").then(again);
	});
	$("#reset").onclick = async () => {
		if (!(await ask("Give @" + u.screen_name + " a new password and sign them out?"))) return;
		act(async () => {
			const r = await api("resetPassword", { id });
			$("#secret").innerHTML = '<div class="secret">New password: <span class="code">' + esc(r.password) + '</span><br><span class="dim small">Shown once. They can sign in with it now.</span></div>';
		});
	};
	$("#signout").onclick = () => act(() => api("signOut", { id }), "Signed out").then(again);
	if ($("#role")) $("#role").onchange = () => act(() => api("setRole", { id, role: $("#role").value }), "Role set").then(again);
	if (can("admin")) $("#notes-access").onchange = () => act(() => api("setNotesAccess", { id, enabled: $("#notes-access").checked }), "Notes access updated").then(again);
	if ($("#delete")) $("#delete").onclick = () => act(async () => { await api("deleteUser", { id, confirm: $("#confirm").value }); go("users"); }, "Account deleted");
	if ($("#addaff")) $("#addaff").onclick = () => act(() => api("addAffiliate", { orgId: id, screen_name: $("#aff").value }), "Affiliate added").then(again);
	const setBadges = (list) => act(() => api("setBadges", { id, badgeIds: list }), "Badges saved").then(again);
	if ($("#addBadge")) $("#addBadge").onchange = () => $("#addBadge").value && setBadges([...u.badge_ids, $("#addBadge").value]);
	main.querySelectorAll("[data-up]").forEach((b) => b.onclick = () => {
		const list = [...u.badge_ids], i = Number(b.dataset.up);
		[list[i - 1], list[i]] = [list[i], list[i - 1]];
		setBadges(list);
	});
	main.querySelectorAll("[data-drop]").forEach((b) => b.onclick = () => setBadges(u.badge_ids.filter((_, i) => i !== Number(b.dataset.drop))));
	if ($("#orgBadge")) $("#orgBadge").onchange = () => act(() => api("setOrgBadge", { id, badgeId: $("#orgBadge").value }), "Badge set").then(again);
	if ($("#send")) $("#send").onclick = async () => {
		if ($("#msgKind").value === "strike" && !(await ask("Give @" + u.screen_name + " a strike?"))) return;
		act(() => api("sendStaffMessage", { id, kind: $("#msgKind").value, body: $("#msgBody").value, escalate: $("#msgEscalate").checked }), "Sent").then(again);
	};
	$("#addNote").onclick = () => act(() => api("addStaffNote", { id, body: $("#noteBody").value }), "Note added").then(again);
	main.querySelectorAll("[data-unstrike]").forEach((b) => b.onclick = () => act(() => api("revokeStrike", { id: b.dataset.unstrike }), "Strike withdrawn").then(again));
	main.querySelectorAll("[data-session]").forEach((b) => b.onclick = () => act(() => api("revokeSession", { sessionId: b.dataset.session }), "Signed out").then(again));
	main.querySelectorAll("[data-unaff]").forEach((b) => b.onclick = () => act(() => api("removeAffiliate", { orgId: id, userId: b.dataset.unaff }), "Removed").then(again));
}

(async function start() {
	try {
		me = await api("me");
		flags = await (await fetch("/admin/flags.json")).json();
	} catch (e) {
		$("#main").innerHTML = '<div class="empty">' + esc(e.message) + ' <a href="/home">Back to {{instance}}</a></div>';
		return;
	}
	$("#nav").insertAdjacentHTML("beforeend", Object.entries(PAGES).filter(([, p]) => !p.role || can(p.role)).map(([k, p]) => '<button data-page="' + k + '"><span class="icon">' + p.icon + "</span>" + esc(p.title) + "</button>").join("") +
		'<button onclick="location.href=\'/home\'"><span class="icon">arrow_back</span>Back to {{instance}}</button>' +
		'<div class="who">@' + esc(me.screen_name) + " · " + esc(me.role) + "</div>");
	document.querySelectorAll("nav [data-page]").forEach((b) => b.onclick = () => go(b.dataset.page));
	refreshCounts();
	route();
})();
</script>
</body>
</html>
